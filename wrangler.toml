name = "dkuzeit"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-02-06"
compatibility_flags = ["nodejs_compat"]
routes = [{ pattern = "dkuzeit.net", custom_domain = true }]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[dev]
port = 8787

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Upstream is the committed fixture snapshot served locally,
# and the clock is pinned inside the snapshot's week range.
[env.e2e.vars]
DKU_BASE_URL = "http://127.0.0.1:8788"
DKU_NOW = "2026-05-06T09:00:00+05:00"
