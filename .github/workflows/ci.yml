name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        name: Build

      - run: pnpm check
        name: Type check

      # The fixture snapshot (tests/fixtures/live) is committed to the repo, so
      # tests and the parser benchmark run against identical data every time and
      # CI never contacts the live scheduler. Refresh it deliberately with:
      # pnpm fixtures:sync
      - run: pnpm test
        name: Unit tests

      - run: pnpm exec tsx tests/bench-parser.ts
        name: Parser benchmark

      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        name: Install Playwright browsers

      - run: pnpm test:e2e
        name: E2E smoke tests
